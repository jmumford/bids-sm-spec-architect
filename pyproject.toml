[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stats_spec_architect"
version = "0.1.0"
description = "GUI for generating BIDS Stats Model spec json files."
readme = "README.md"
authors = [
    { name = "Jeanette Mumford", email = "jeanette.mumford@gmail.com" } 
]
requires-python = ">=3.12"
dependencies = [
    "bsmschema>=0.1.1",
    "jsonref>=1.1.0",
    "numpy>=2.1.1",
    "pybids>=0.18.1",
    "pydantic>=2.11.9",
    "ttkbootstrap>=1.10.1",
]

[project.scripts]
build_model = "stats_spec_architect.__main__:main"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
]

[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["E501", "W", "N", "R", "I"]
