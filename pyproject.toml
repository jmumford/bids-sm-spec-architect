[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "stats_spec_architect"
version = "0.1.0"
description = "GUI for generating BIDS Stats Model spec json files."
readme = "README.md"
authors = [
    { name = "Jeanette Mumford", email = "jeanette.mumford@gmail.com" } 
]
requires-python = ">=3.12"
dependencies = [
    "bsmschema",
    "jsonref>=1.1.0",
    "numpy>=2.1.1",
    "pybids>=0.18.1",
    "pydantic>=2.11.9",
    "ttkbootstrap>=1.10.1",
]

[project.scripts]
make_spec = "stats_spec_architect.__main__:main"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.4",
]

[tool.uv.sources]
bsmschema = { path = "../stats-models/bsmschema" }


[tool.setuptools]
packages = ["stats_spec_architect"]

[tool.setuptools.package-data]
stats_spec_architect = ["assets/*.json", "assets/*.png"]


[tool.ruff]
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = ["E501", "W", "N", "R", "I"]
